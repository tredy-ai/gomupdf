name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build · vet · test · coverage
    runs-on: ubuntu-latest
    # Alpine 3.22 userland (MuPDF 1.25.6 from apk, musl). Alpine's own `go`
    # package (1.24) is older than go.mod's `go 1.25`, so use the official Go
    # image built on Alpine 3.22.
    container: golang:1.25-alpine3.22
    steps:
      - name: Install build dependencies
        # git for actions/checkout; bash, curl and gnupg for codecov-action,
        # which runs its uploader with them. build-base = gcc + musl-dev.
        run: apk add --no-cache build-base pkgconf mupdf-dev git bash curl gnupg

      - name: Checkout
        uses: actions/checkout@v4

      - name: MuPDF version
        run: |
          apk info mupdf-dev
          pkg-config --modversion mupdf || true
          pkg-config --libs mupdf

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Build without the MuPDF backend (build-tag seam)
        # The public API is backend-neutral; -tags nomupdf must compile with all
        # cgo excluded (constructors then return errNoBackend).
        run: go build -tags nomupdf ./...

      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary & gate
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 >= 80 ? 0 : 1) }' \
            || { echo "Coverage ${total}% is below the 80% gate"; exit 1; }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
