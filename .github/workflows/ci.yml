name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the workflow be started by hand: the Actions tab, or
  # `gh workflow run CI --ref main`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build · vet · test · coverage
    # Blacksmith's 2-vCPU runner, as the organisation's other repositories use.
    runs-on: blacksmith-2vcpu-ubuntu-2604
    # Alpine 3.23 userland (MuPDF 1.26.11 from apk, musl), with the official Go
    # 1.27 image built on Alpine 3.23 to match go.mod's `go 1.27`.
    container: golang:1.27-alpine3.23
    outputs:
      mupdf: ${{ steps.mupdf.outputs.version }}
    steps:
      - name: Install build dependencies
        # git for the checkout action and codecov-action; bash, curl and gnupg for
        # codecov-action uploader. build-base = gcc + musl-dev.
        run: apk add --no-cache build-base pkgconf mupdf-dev git bash curl gnupg

      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: MuPDF version
        id: mupdf
        run: |
          apk info mupdf-dev
          pkg-config --libs mupdf
          echo "version=$(pkg-config --modversion mupdf)" >> "$GITHUB_OUTPUT"

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Build without the MuPDF backend (build-tag seam)
        # The public API is backend-neutral; -tags nomupdf must compile with all
        # cgo excluded (constructors then return errNoBackend).
        run: go build -tags nomupdf ./...

      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary & gate
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 >= 80 ? 0 : 1) }' \
            || { echo "Coverage ${total}% is below the 80% gate"; exit 1; }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: tag · release
    # Every commit on main that passes the tests is released: a version tag and
    # a GitHub release with notes. .github/scripts/next-release.sh decides the
    # version from the Conventional Commits since the last tag (a breaking
    # change or a feat bumps the minor, anything else the patch; the major only
    # changes with the module path in go.mod). A pull request releases nothing.
    # A manual run on main releases its head if a release is missing.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2604
    permissions:
      contents: write # create the tag and the release
    # One release at a time, so two pushes cannot compute the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0 # the version comes from the tags and the commits since
          fetch-tags: true

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          MUPDF_VERSION: ${{ needs.test.outputs.mupdf }}
        run: |
          git fetch --tags --force --quiet origin
          tag=$(.github/scripts/next-release.sh "$RUNNER_TEMP/notes.md")
          if [ -z "$tag" ]; then
            echo "This commit is already released."
            exit 0
          fi
          echo "Releasing $tag"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
